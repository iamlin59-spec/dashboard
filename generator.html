<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator with Expiry</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-900 p-8 rounded-lg shadow-xl max-w-lg w-full border border-gray-800">
        <h2 class="text-2xl font-bold mb-6 text-orange-500">Create Tracking Link</h2>
        
        <div class="mb-4">
            <label class="block text-sm text-gray-400 mb-2">Target URL (News / Video)</label>
            <input type="text" id="targetUrl" value="https://www.youtube.com/watch?v=eNOxXrElL8Y" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white">
        </div>

        <div class="mb-6">
            <label class="block text-sm text-gray-400 mb-2">Validity (in Hours)</label>
            <input type="number" id="expiryHours" value="24" class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-white" placeholder="24">
        </div>

        <button onclick="generateLink()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded transition">
            Generate Secure Link
        </button>

        <div id="resultBox" class="mt-6 hidden">
            <label class="block text-sm text-gray-400 mb-2">Generated Link:</label>
            <input type="text" id="finalLink" readonly class="w-full bg-gray-800 border border-gray-700 rounded p-3 text-orange-300 text-sm mb-3">
            <button onclick="copyLink()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded transition text-sm">
                Copy Link
            </button>
        </div>
    </div>

    <script>
        function generateLink() {
            const target = document.getElementById('targetUrl').value;
            const hours = parseInt(document.getElementById('expiryHours').value) || 24;
            
            // Calculate expiry timestamp (Current time + hours in milliseconds)
            const expiryTime = Date.now() + (hours * 60 * 60 * 1000);
            
            const baseUrl = window.location.origin + window.location.pathname.replace('generator.html', 'news.html');
            const encodedTarget = encodeURIComponent(target);
            
            const finalUrl = `${baseUrl}?target=${encodedTarget}&exp=${expiryTime}`;
            
            document.getElementById('finalLink').value = finalUrl;
            document.getElementById('resultBox').classList.remove('hidden');
        }

        function copyLink() {
            const copyText = document.getElementById('finalLink');
            copyText.select();
            document.execCommand('copy');
            alert('Link copied to clipboard!');
        }
    </script>
</body>
</html>
